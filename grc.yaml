# okf-grc scan layout. Scan inputs (inventory, conftest.inputs, checkov.skip_paths) are
# relative to the target; the other paths are relative to the repo root.
target: upstream
knowledge: knowledge
inventory: ../ai-inventory.yaml
conftest:
  inputs: ['kubernetes-manifests/*.yaml', 'terraform/*.tf', 'kustomize/components/shopping-assistant/shoppingassistantservice.yaml', '../ai-inventory.yaml']
skip_paths: [helm-chart, kustomize/base, kustomize/components/without-loadgenerator, release, .github]  # templated, duplicate, or delete-only manifests, and upstream's own CI
checkov:
  frameworks: [terraform, kubernetes, dockerfile]
  skip_paths: []
semgrep:
  configs: [policies/semgrep]
rego: [policies/rego]
scanner_timeout: 900  # seconds per scanner
allow_external_symlinks: false  # accept a Conftest input that is a symlink out of the repo

# Type 2 evidence (grc-evidence 2.0): the nightly job collects, appends to the evidence ledger (the `ledger`
# branch, checked out into evidence/) and writes the window report. Pull requests skip the collectors.
window: {start: 2026-10-01, end: 2026-12-31}
people: pseudonymous  # upstream's contributors are named p-<HMAC>; the salt is the GRC_PEOPLE_SALT secret
github:
  scanner_jobs: [scan]  # the job that runs the scanners; grc-evidence runs its own in its `test` job
  repos:
    - {name: GoogleCloudPlatform/microservices-demo, tier: in-scope, collect: [changes]}
    - {name: cdevarenne/grc-evidence, tier: in-scope, collect: [scm]}
    - {name: cdevarenne/grc-evidence-boutique, tier: in-scope, collect: [scm]}

# How long a person's verification of a concept stays valid (grc-evidence 2.1): `grc check` warns 30 days
# before and fails after. An overdue base-bundle copy only warns here (base: warn): the engine re-verifies it.
review:
  default: 1y
  by_type:
    SOC 2 Control: 1y
    ISO/IEC 42001 Control: 1y
    EU AI Act Article: 1y
    Crosswalk: 6m
    Rego Policy: 6m
    Semgrep Rule: 6m
    Scanner Check: 6m
    Scanner: 6m
    Stack Component: 90d
